<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Akshat Nahar | Portfolio - Photo Gallery</title>
  <style>
    /* Reset & Cross-Platform System Styles */
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent; /* Removes dark tap flash on Android */
    }
    
    body { 
      background: #000000 url('index(1).jpeg') no-repeat center center fixed; 
      background-size: cover;
      color: #ffffff; 
      line-height: 1.6; 
      padding: 0;
      overflow-x: hidden;
      width: 100%;
    }

    /* Universal Glass Container Backdrop */
    .glass-panel {
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
    }
    
    header { 
      padding: 60px 20px; 
      text-align: center;
      background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.9)), url('index.jpeg') no-repeat center center;
      background-size: cover;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    header img {
      border-radius: 50%;
      object-fit: cover;
      width: 160px;
      height: 160px;
      margin-bottom: 15px;
      border: 3px solid #04c5fa;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    h1 { 
      font-size: 2.3rem; 
      font-weight: 700;
      margin-bottom: 5px; 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      letter-spacing: -0.5px;
    }

    /* Responsive Navigation Layout */
    .nav-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 20px;
      max-width: 1040px;
      margin: 20px auto 0;
    }

    .btn { 
      display: inline-flex; 
      align-items: center;
      justify-content: center;
      padding: 12px 24px; 
      background: #04c5fa; 
      color: #0b0b0b; 
      text-decoration: none; 
      border-radius: 10px; 
      font-weight: 600;
      font-size: 0.95rem;
      min-height: 48px; /* Safe mobile tap targeting */
      transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
      text-align: center;
    }

    .btn:hover { 
      background: #039ec8; 
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(4, 197, 250, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    main {
      padding: 10px 20px;
    }

    section { 
      padding: 40px 20px; 
      max-width: 1040px; 
      margin: 16px auto; 
    }

    p { 
      color: #e2e8f0; 
      line-height: 1.6; 
      max-width: 720px; 
      margin: 0 auto 30px; 
      text-align: center;
    }

    /* Responsive Grid for Images */
    .gallery-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 20px; 
      padding: 10px 0;
    }

    .gallery-grid img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery-grid img:hover {
      transform: translateY(-4px);
      border-color: #04c5fa;
      box-shadow: 0 6px 18px rgba(4, 197, 250, 0.2);
    }

    footer { 
      background: #04f7db; 
      padding: 32px 16px; 
      text-align: center; 
      color: #0b0b0b; 
      font-size: 0.9rem; 
      font-weight: 600;
      margin-top: 60px;
    }

    /* Media Queries for Perfect Device Responsiveness */
    @media (max-width: 768px) {
      header {
        padding: 40px 16px;
      }
      
      h1 { 
        font-size: 1.8rem; 
      }

      .nav-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr); /* 2 columns across mobile screens */
        gap: 8px;
        padding: 12px;
      }

      .btn { 
        width: 100%; 
        padding: 10px 14px;
        font-size: 0.88rem;
      }

      section {
        padding: 30px 16px;
      }

      .gallery-grid { 
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }
      
      .gallery-grid img { 
        height: 260px; 
      }
    }

    @media (max-width: 420px) {
      /* Stack menu links directly on narrow phones */
      .nav-container {
        grid-template-columns: 1fr;
      }
      
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <img src="photo.jpeg" alt="Akshat Nahar">
    <h1>Welcome!</h1>
    <h1>To Photo Gallery</h1>
  </header>

  <nav class="nav-container">
    <a href="index.html" class="btn">Home</a>  
    <a href="index(1).html" height=500 class="btn">Photo Gallery</a>
    <a href="index(2).html" class="btn">Video Gallery</a>
    <a href="index(3).html" class="btn">Social Media</a>
    <a href="index(4).html" class="btn">Certificates</a>
    <a href="index(5).html" class="btn">Feedback</a>
  </nav>

  <main>
    <section id="photo" class="glass-panel">
      <p style="font-size: 1.5rem; text-shadow: 1px 1px 3px rgba(0,0,0,0.8);">
        Here are the photos related to my academics and subjects.
      </p>
      
      <div id="demo" style="text-align:center; color:#04c5fa; margin-bottom: 10px; font-weight: 500;"></div>

      <div class="gallery-grid">
        <img src="july.jpeg" alt="Academic Photo July">
        <img src="aug.jpeg" alt="Academic Photo August">
        <img src="nov.jpeg" alt="Academic Photo November">
        <img src="dec.jpeg" alt="Academic Photo December">
        <img src="jan.jpeg" alt="Academic Photo January">
      </div>
    </section>
  </main>
    
  <footer>
    © 2026 Akshat Nahar. Built with Akshat Digital Intelligence.
  </footer>

  <script>
    console.log("Photo Gallery Script running smoothly.");
    document.getElementById("demo").innerText = "• Academic Timeline Visuals •";
  </script>
</body>
</html>
