<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshat Nahar | Portfolio</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }
        
        body { 
            background: rgb(0, 0, 0); 
            color: #ffffff; 
            line-height: 1.6; 
        }

        header { 
            padding: 60px 20px; 
            text-align: center;
            background: url('index.jpeg') no-repeat center center;
            background-size: cover;
        }

        header img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        h1 { 
            font-size: 2.5rem; 
            margin-bottom: 10px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        /* Navigation Button Container */
        .nav-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            padding: 30px 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .btn { 
    display: inline-block; 
    padding: 6px 14px; /* Pehle 12px 24px tha, padding kam karne se size chota ho jayega */
    color: #0b0b0b; 
    text-decoration: none; 
    border-radius: 6px; /* Chote button ke sath chota radius zyada achha lagta h */
    font-weight: bold;
    font-size: 0.8rem; /* Font size ko 0.9rem se kam karke 0.8rem kiya */
    text-align: center;
    transition: background 0.3s ease, transform 0.2s ease, border-color 0.3s ease;
}

.nav-btn {
    background: #04c5fa;
    flex: 1 1 calc(33.33% - 10px); /* Mobile view par ek line mei 3 buttons aane lagenge */
    max-width: 120px; /* Chota size maintain karne ke liye max-width kam ki */
}

        .btn:hover { 
            background: #03a8d4; 
            transform: translateY(-2px);
        }

        /* Certificate Gallery Section */
        #certificates-gallery { 
            padding: 40px 20px; 
            max-width: 1000px; 
            margin: 0 auto; 
        }

        .image-gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .image-gallery img {
            width: 100%;
            max-width: 900px; /* Limits maximum desktop size */
            height: auto; /* Maintains aspect ratio automatically */
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(250, 250, 250, 0.1);
        }

        footer { 
            background: #04f7db; 
            text-align: center; 
            padding: 30px 20px; 
            color: #0b0b0b; 
            font-size: 0.9rem; 
            font-weight: 500;
            margin-top: 50px;
        }

        /* Target Mobile (Apple & Android) & Small Tablets */
        @media (max-width: 600px) {
    .nav-btn { 
        /* width: 100%; ko hata diya h taaki mobile me buttons chote dikhein */
        flex: 1 1 calc(33.33% - 10px); 
    } 
}
    </style>
</head>
<body style="background: url('index(1).jpeg') no-repeat center center fixed; background-size: cover;">

    <header>
        <img src="certify.jpeg" width="350" height="350" alt="Akshat Nahar">
        <h1>Check My</h1>
        <h1>Certificates</h1>
    </header>

    <nav class="nav-container">
        <a href="index.html" class="btn">Home</a>  
        <a href="index(1).html" class="btn">Photo Gallery</a>
        <a href="index(2).html" class="btn">Video Gallery</a>
        <a href="index(3).html" class="btn">Social Media</a>
        <a href="index(4).html" class="btn">Certificates</a>
        <a href="index(5).html" class="btn">Feedback</a>
    </nav>

    <section id="certificates-gallery">
        <div class="image-gallery">
            <img src="c1.jpeg" alt="Certificate 1">
            <img src="c2.jpeg" alt="Certificate 2">
            <img src="c3.jpeg" alt="Certificate 3">
            <img src="o1.jpeg" alt="Other Image 1">
            <img src="o2.jpeg" alt="Other Image 2">
            <img src="o3.jpeg" alt="Other Image 3">
        </div>
    </section>
      
    <footer>
        &copy; 2026 Akshat Nahar. Built with Akshat Digital Intelligence.
    </footer>

    <script>
        console.log("Hello from index.js");
        // Safe check in case the element 'demo' exists elsewhere in your template
        const demoElem = document.getElementById("demo");
        if (demoElem) {
            demoElem.innerText = "JS loaded";
        }
    </script>
</body>
</html>
