<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Akshat Nahar | Portfolio - Certificates</title>
  <style>
    /* Reset and Base Styles */
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; 
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent; /* Fixes unexpected tap flash highlights on mobile devices */
    }
    
    body { 
      background: #000000 url('index(1).jpeg') no-repeat center center fixed; 
      background-size: cover; 
      color: #ffffff; 
      line-height: 1.6; 
      overflow-x: hidden;
      width: 100%;
    }

    /* Universal Glass Container Backdrop */
    .glass-panel {
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
    }

    /* Header Styling */
    header { 
      padding: 60px 20px; 
      text-align: center; 
      background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.9)), url('index.jpeg') no-repeat center center; 
      background-size: cover;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    header img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      margin-bottom: 15px;
      border: 3px solid #04c5fa;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    h1 { 
      font-size: 2.3rem; 
      font-weight: 700;
      line-height: 1.2;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      letter-spacing: -0.5px;
    }
    
    /* Responsive Navigation Layout */
    .nav-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 20px;
      max-width: 1040px;
      margin: 20px auto 0;
    }
    
    /* Optimized Interactive Touch Targets */
    .btn { 
      display: inline-flex; 
      align-items: center;
      justify-content: center;
      padding: 12px 24px; 
      background: #04c5fa; 
      color: #0b0b0b; 
      text-decoration: none; 
      border-radius: 10px; 
      font-weight: 600;
      font-size: 0.95rem;
      min-height: 48px; /* Standard mobile tap target size */
      transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
      text-align: center;
    }

    .btn:hover { 
      background: #039ec8; 
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(4, 197, 250, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Main Container Content */
    main {
      padding: 10px 20px;
    }

    /* Certificates Gallery Layout Block */
    #certificates-gallery { 
      padding: 40px 20px; 
      max-width: 1040px; 
      margin: 16px auto; 
    }
    
    .image-gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    
    .image-gallery img {
      width: 100%;
      max-width: 850px; /* Clean standard layout reading view alignment width */
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .image-gallery img:hover {
      transform: scale(1.015);
      box-shadow: 0 12px 40px rgba(4, 197, 250, 0.25);
    }

    /* Footer Layout */
    footer { 
      background: #04f7db; 
      padding: 32px 16px; 
      text-align: center; 
      color: #0b0b0b; 
      font-size: 0.9rem; 
      font-weight: 600;
      margin-top: 60px;
    }

    /* Multi-Device Media Viewport Targets */
    @media (max-width: 768px) {
      header {
        padding: 40px 16px;
      }
      
      h1 { font-size: 1.8rem; }
      header img { max-width: 180px; }
      
      .nav-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr); /* Clean 2-column touch structure for Android & iOS mobile layouts */
        gap: 8px;
        padding: 12px;
      }

      .btn {
        width: 100%;
        padding: 10px 14px;
        font-size: 0.88rem;
      }

      #certificates-gallery {
        padding: 30px 16px;
      }

      .image-gallery {
        gap: 20px;
      }
    }

    @media (max-width: 420px) {
      /* Stack layout handles extremely tight micro-screen width safely */
      .nav-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <img src="certify.jpeg" alt="Akshat Nahar Profile Pic">
    <h1>Check My</h1>
    <h1>Certificates</h1>
  </header>

  <nav class="nav-container">
    <a href="index.html" class="btn">Home</a>  
    <a href="index(1).html" class="btn">Photo Gallery</a>
    <a href="index(2).html" class="btn">Video Gallery</a>
    <a href="index(3).html" class="btn">Social Media</a>
    <a href="index(4).html" class="btn">Certificates</a>
    <a href="index(5).html" class="btn">Feedback</a>
  </nav>

  <main>
    <section id="certificates-gallery" class="glass-panel">
      <div class="image-gallery">
        <img src="c1.jpeg" alt="Certificate 1">
        <img src="c2.jpeg" alt="Certificate 2">
        <img src="c3.jpeg" alt="Certificate 3">
        <img src="o1.jpeg" alt="Other Image 1">
        <img src="o2.jpeg" alt="Other Image 2">
        <img src="o3.jpeg" alt="Other Image 3">
      </div>
    </section>
  </main>
      
  <footer>
    &copy; 2026 Akshat Nahar. Built with Akshat Digital Intelligence.
  </footer>

  <script>
    console.log("Hello from index.js");
    const demoElem = document.getElementById("demo");
    if (demoElem) {
        demoElem.innerText = "JS loaded";
    }
  </script>
</body>
</html>
