<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshat Nahar | Social Media</title>
    <style>
        /* Reset and Base Styles */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }
        body { 
            background: url('index(1).jpeg') no-repeat center center fixed; 
            background-size: cover; 
            color: #ffffff; 
            line-height: 1.6; 
        }
        header { 
            padding: 60px 20px; 
            text-align: center; 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('index.jpeg') no-repeat center center; 
            background-size: cover;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        header img {
            width: 100%;
            max-width: 220px;
            height: auto;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 3px solid #04c5fa;
            object-fit: cover;
        }
        h1 { 
            font-size: 2.5rem; 
            margin-bottom: 10px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        h2 {
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        
        /* Navigation Section */
        .nav-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding: 30px 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        
        /* Premium Small Sized Buttons */
        .btn { 
            display: inline-block; 
            padding: 6px 14px; 
            background: #04c5fa; 
            color: #0b0b0b; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold;
            font-size: 0.8rem;
            transition: background 0.3s ease, transform 0.2s ease, border-color 0.3s ease;
            text-align: center;
        }
        .btn:hover { 
            background: #03a0cc; 
            transform: translateY(-2px);
        }

        .nav-btn {
            flex: 1 1 calc(33.33% - 10px);
            max-width: 120px;
        }

        /* Social Media Section */
        #social-media { 
            padding: 40px 20px; 
            max-width: 1100px; 
            margin: 0 auto; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 25px; 
        }
        .card { 
            background: rgba(26, 26, 26, 0.93); 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #04c5fa;
        }
        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .card .btn {
            width: 100%;
            background-color: #04c5fa;
            color: #0b0b0b;
        }
        .card .btn:hover {
            background-color: #03a3d0;
        }

        /* Map Container Layout */
        .map-wrapper {
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 40px 20px;
        }
        .map-container {
            background-color: #ffffff; 
            padding: 15px; 
            border: 1px solid #e0e0e0; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 630px;
        }
        iframe {
            border: 0; 
            border-radius: 4px;
            width: 100%;
            height: 450px;
        }

        footer { 
            background: #04f7db; 
            padding: 30px 20px; 
            text-align: center; 
            color: #0b0b0b; 
            font-size: 0.9rem; 
            font-weight: bold;
            margin-top: 50px;
        }

        /* Responsive Mobile Architecture */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            h2 { font-size: 1.6rem; }
            header img { max-width: 180px; }
            iframe { height: 320px; }
            .nav-btn {
                flex: 1 1 calc(33.33% - 10px);
                max-width: 110px;
            }
        }
    </style>
</head>
<body>

    <header>
        <img src="socialmedia.jpeg" alt="Akshat Nahar Header Logo">
        <h1>Follow Us On</h1>
    </header>

    <nav id="about" class="nav-container">
        <a href="index.html" class="nav-btn btn">Home</a>  
        <a href="index(1).html" class="nav-btn btn">Photo Gallery</a>
        <a href="index(2).html" class="nav-btn btn">Video Gallery</a>
        <a href="index(3).html" class="nav-btn btn">Social Media</a>
        <a href="index(4).html" class="nav-btn btn">Certificates</a>
        <a href="index(5).html" class="nav-btn btn">Feedback</a>
    </nav>

    <main>

            <div class="grid">
                <div class="card">

                    <a href="https://www.linkedin.com/in/akshat-nahar-jain-6b2a6a31a/" target="_blank" class="btn">LinkedIn</a>
                </div>
                <div class="card">
                    <img src="b.jpeg" alt="Instagram Profile">
                    <a href="https://www.instagram.com/akshatnahar.in/" target="_blank" class="btn">Instagram</a>
                </div>
                <div class="card">

                    <a href="https://www.threads.com/@akshatnahar.in" target="_blank" class="btn">Threads</a>

                <div class="card">

                <div class="card">

                    <a href="https://www.facebook.com/profile.php?id=61576915678488" target="_blank" class="btn">Facebook</a>

        <section class="map-wrapper">
            <div class="map-container">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3572.24719602494!2d74.63287817542318!3d26.45746117692138!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x396be71c1259038d%3A0x387b34445ffb8a32!2sMadar%20Gate!5e0!3m2!1sen!2sin!4v1716418000000!5m2!1sen!2sin" 
                    loading="lazy"

                    allowfullscreen>
                </iframe>
            </div>
        </section>
    </main>
      
    <footer>
        © 2026 Akshat Nahar. Built with Akshat Digital Intelligence.
    </footer>
</body>
</html>
