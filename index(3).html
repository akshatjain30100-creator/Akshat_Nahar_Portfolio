<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshat Nahar | Portfolio</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }
        body { 
            background: url('index(1).jpeg') no-repeat center center fixed; 
            background-size: cover; 
            color: #ffffff; 
            line-height: 1.6; 
        }
        header { 
            padding: 60px 20px; 
            text-align: center; 
            background: url('index.jpeg') no-repeat center center; 
            background-size: cover; 
        }
        header img {
            width: 100%;
            max-width: 300px;
            height: auto;
            border-radius: 50%;
            margin-bottom: 15px;
        }
        h1 { 
            font-size: 2.5rem; 
            margin-bottom: 10px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        
        /* Navigation Section */
        .nav-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 30px 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .btn { 
            display: inline-block; 
            padding: 12px 24px; 
            background: #4f46e5; 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold;
            text-align: center;
            transition: background 0.3s ease;
        }
        .btn:hover { 
            background: #4338ca; 
        }
        .nav-btn {
            background: #04c5fa;
            flex: 1 1 calc(50% - 10px); /* 2 per row on mobile */
            max-width: 180px;
        }
        .nav-btn:hover {
            background: #03a3d0;
        }

        /* Social Media Section */
        #social-media { 
            padding: 40px 20px; 
            max-width: 1100px; 
            margin: 0 auto; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 25px; 
        }
        .card { 
            background: rgba(26, 26, 26, 0.9); 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #333; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .card img {
            width: 100%;
            max-width: 260px;
            height: 350px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .card .btn {
            width: 100%;
            background-color: #007bff;
        }

        /* Map Container */
        .map-wrapper {
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 40px 20px;
        }
        .map-container {
            background-color: #ffffff; 
            padding: 15px; 
            border: 1px solid #e0e0e0; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.3); 
            width: 100%; 
            max-width: 630px;
        }
        iframe {
            border: 0; 
            border-radius: 4px;
            width: 100%;
            height: 400px;
        }

        footer { 
            background: #04f7db; 
            padding: 30px 20px; 
            text-align: center; 
            color: #0b0b0b; 
            font-size: 0.9rem; 
            font-weight: bold;
        }

        /* Desktop Adjustments */
        @media (min-width: 768px) {
            h1 { font-size: 3.5rem; }
            .nav-btn { flex: 0 1 auto; } /* Normal sizing on desktop */
            header { padding: 80px 20px; }
            iframe { height: 450px; }
        }
    </style>
</head>
<body>

    <header>
        <img src="socialmedia.jpeg" alt="Akshat Nahar">
        <h1>Follow Us On</h1>
    </header>

    <section id="about" class="nav-container">
        <a href="index.html" class="btn nav-btn">Home</a>  
        <a href="index(1).html" class="btn nav-btn">Photo Gallery</a>
        <a href="index(2).html" class="btn nav-btn">Video Gallery</a>
        <a href="index(3).html" class="btn nav-btn">Social Media</a>
        <a href="index(4).html" class="btn nav-btn">Certificates</a>
        <a href="index(5).html" class="btn nav-btn">Feedback</a>
    </section>

    <section id="social-media">
        <div class="grid">
            <div class="card">
                <img src="a.jpeg" alt="LinkedIn Profile Pic">
                <a href="https://www.linkedin.com/in/akshat-nahar-jain-6b2a6a31a/" class="btn">LinkedIn</a>
            </div>
            <div class="card">
                <img src="b.jpeg" alt="Instagram Profile Pic">
                <a href="https://www.instagram.com/akshatnahar.in/" class="btn">Instagram</a>
            </div>
            <div class="card">
                <img src="c.jpeg" alt="Threads Profile Pic">
                <a href="https://www.threads.com/@akshatnahar.in" class="btn">Threads</a>
            </div>
            <div class="card">
                <img src="d.jpeg" alt="GitHub Repository Pic">
                <a href="https://github.com/akshatjain30100-creator/C-Language-Prgt" class="btn">GitHub</a>
            </div>
            <div class="card">
                <img src="e.jpeg" alt="X Profile Pic">
                <a href="https://x.com/AkshatJain81893" class="btn">X</a>
            </div>
            <div class="card">
                <img src="f.jpeg" alt="Facebook Profile Pic">
                <a href="https://www.facebook.com/profile.php?id=61576915678488" class="btn">Facebook</a>
            </div>
        </div>
    </section>

    <div class="map-wrapper">
        <div class="map-container">
            <iframe 
                src="https://maps.google.com/maps?q=Delhi&t=&z=13&ie=UTF-8&iwloc=&output=embed" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade"
                allowfullscreen>
            </iframe>
        </div>
    </div>
      
    <footer>
        &copy; 2026 Akshat Nahar. Built with Akshat Digital Intelligence.
    </footer>

        // document.getElementById("demo").innerText = "JS loaded";
    </script>
</body>
</html>
