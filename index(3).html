<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Akshat Nahar | Portfolio - Social Media</title>
  <style>
    /* Reset and Base Styles */
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; 
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent; /* Removes dark tap flash block on mobile browser links */
    }
    
    body { 
      background: #000000 url('index(1).jpeg') no-repeat center center fixed; 
      background-size: cover; 
      color: #ffffff; 
      line-height: 1.6; 
      overflow-x: hidden;
      width: 100%;
    }

    /* Universal Glass Container Backdrop */
    .glass-panel {
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
    }

    /* Header Styling */
    header { 
      padding: 60px 20px; 
      text-align: center; 
      background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.9)), url('index.jpeg') no-repeat center center; 
      background-size: cover;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    header img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      margin-bottom: 15px;
      border: 3px solid #04c5fa;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    h1 { 
      font-size: 2.3rem; 
      font-weight: 700;
      margin-bottom: 5px; 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      letter-spacing: -0.5px;
    }
    
    h2 {
      font-size: 2rem;
      text-align: center;
      margin-bottom: 24px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    
    /* Responsive Navigation Layout */
    .nav-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 20px;
      max-width: 1040px;
      margin: 20px auto 0;
    }
    
    /* Optimized Sized Interactive Targets */
    .btn { 
      display: inline-flex; 
      align-items: center;
      justify-content: center;
      padding: 12px 24px; 
      background: #04c5fa; 
      color: #0b0b0b; 
      text-decoration: none; 
      border-radius: 10px; 
      font-weight: 600;
      font-size: 0.95rem;
      min-height: 48px; /* Safe mobile tap target size */
      transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
      text-align: center;
    }

    .btn:hover { 
      background: #039ec8; 
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(4, 197, 250, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Main Container Padding */
    main {
      padding: 10px 20px;
    }

    /* Social Media Layout Grid */
    #social-media { 
      padding: 40px 20px; 
      max-width: 1040px; 
      margin: 16px auto; 
    }
    
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); 
      gap: 20px; 
    }
    
    .card { 
      background: rgba(26, 26, 26, 0.5); 
      padding: 20px; 
      border-radius: 14px; 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    
    .card:hover {
      transform: translateY(-4px);
      border-color: #04c5fa;
      box-shadow: 0 6px 18px rgba(4, 197, 250, 0.2);
    }
    
    /* Displays Full Size Photos Without Cropping */
    .card img {
      width: 100%;
      height: auto;
      max-height: 320px; /* Limits oversized vertical blowouts while maintaining full uncropped aspect ratio */
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(0, 0, 0, 0.2);
    }
    
    .card .btn {
      width: 100%;
    }

    /* Map Layout Wrappers */
    .map-wrapper {
      padding: 40px 20px;
      max-width: 1040px;
      margin: 16px auto;
    }
    
    .map-container {
      padding: 12px; 
      background: rgba(26, 26, 26, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08); 
      border-radius: 14px; 
      box-shadow: 0 6px 20px rgba(0,0,0,0.4); 
      width: 100%; 
      max-width: 700px;
      margin: 0 auto;
    }
    
    iframe {
      border: 0; 
      border-radius: 8px;
      width: 100%;
      height: 400px;
      display: block;
    }

    /* Footer Layout */
    footer { 
      background: #04f7db; 
      padding: 32px 16px; 
      text-align: center; 
      color: #0b0b0b; 
      font-size: 0.9rem; 
      font-weight: 600;
      margin-top: 60px;
    }

    /* Multi-Device Media Viewport Targets */
    @media (max-width: 768px) {
      header {
        padding: 40px 16px;
      }
      
      h1 { font-size: 1.8rem; }
      h2 { font-size: 1.5rem; }
      header img { max-width: 180px; }
      iframe { height: 300px; }
      
      .nav-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr); /* Unified 2 column system for Android/iOS handheld grids */
        gap: 8px;
        padding: 12px;
      }

      .btn {
        width: 100%;
        padding: 10px 14px;
        font-size: 0.88rem;
      }

      section {
        padding: 30px 16px;
      }
      
      .grid {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }
    }

    @media (max-width: 420px) {
      /* Dynamic inline stack for narrower smart screens */
      .nav-container {
        grid-template-columns: 1fr;
      }
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <footer>

</html>
