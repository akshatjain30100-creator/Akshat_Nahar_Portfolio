<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Akshat Nahar | Portfolio - Feedback</title>
  <style>
    /* Reset and Base Styles */
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; 
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent; /* Eliminates tap flash block artifacts on mobile devices */
    }
    
    body { 
      background: #000000 url('index(1).jpeg') no-repeat center center fixed; 
      background-size: cover; 
      color: #ffffff; 
      line-height: 1.6; 
      overflow-x: hidden;
      width: 100%;
    }

    /* Universal Glass Container Backdrop */
    .glass-panel {
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
    }
    
    /* Header Styling */
    header { 
      padding: 60px 20px; 
      text-align: center; 
      background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.9)), url('index.jpeg') no-repeat center center; 
      background-size: cover;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    header img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      margin-bottom: 15px;
      border: 3px solid #04c5fa;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    
    h1 { 
      font-size: 2.3rem; 
      font-weight: 700;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      letter-spacing: -0.5px;
    }

    /* Responsive Navigation Layout */
    .nav-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 20px;
      max-width: 1040px;
      margin: 20px auto 0;
    }

    /* Optimized Touch Interactive Link Anchors */
    .btn { 
      display: inline-flex; 
      align-items: center;
      justify-content: center;
      padding: 12px 24px; 
      background: #04c5fa; 
      color: #0b0b0b; 
      text-decoration: none; 
      border-radius: 10px; 
      font-weight: 600;
      font-size: 0.95rem;
      min-height: 48px; /* High fidelity mobile touch targeting size */
      transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
      text-align: center;
    }
    
    .btn:hover { 
      background: #039ec8; 
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(4, 197, 250, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }
    
    /* Main Content Wrapper padding */
    main {
      padding: 10px 20px;
    }

    /* Feedback Section Wrapper Block */
    section#feedback { 
      padding: 40px 20px; 
      max-width: 1040px; 
      margin: 16px auto; 
      text-align: center;
    }

    .feedback-title {
      font-size: 2rem;
      margin-bottom: 24px;
      font-weight: 700;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    /* Flexible High Performance iFrame System wrapper */
    .iframe-wrapper {
      position: relative;
      width: 100%;
      max-width: 750px;
      margin: 0 auto 24px;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 6px 25px rgba(0,0,0,0.6);
    }

    .iframe-wrapper iframe {
      width: 100%;
      height: 75vh; /* Scales elegantly across dynamic viewport form factor sizes */
      border: 0;
      display: block;
      background: #ffffff;
    }
    
    .card { 
      background: rgba(26, 26, 26, 0.5); 
      padding: 16px 24px; 
      border-radius: 12px; 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      font-size: 1.05rem;
      font-weight: 500;
      max-width: 600px;
      margin: 20px auto 0;
      color: #e2e8f0;
      text-align: center;
    }
    
    /* Footer Styling */
    footer { 
      background: #04f7db; 
      padding: 32px 16px; 
      text-align: center; 
      color: #0b0b0b; 
      font-size: 0.9rem; 
      font-weight: 600;
      margin-top: 60px;
    }

    /* Cross-Platform Viewport Media Queries */
    @media (max-width: 768px) {
      header {
        padding: 40px 16px;
      }
      
      h1 { font-size: 1.8rem; }
      header img { max-width: 180px; }
      
      .nav-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr); /* 2 balanced columns system for mobile view configurations */
        gap: 8px;
        padding: 12px;
      }

      .btn {
        width: 100%;
        padding: 10px 14px;
        font-size: 0.88rem;
      }

      section#feedback {
        padding: 30px 16px;
      }

      .feedback-title {
        font-size: 1.5rem;
      }
      
      .iframe-wrapper iframe {
        height: 70vh;
      }

      .card {
        font-size: 0.95rem;
      }
    }

    @media (max-width: 420px) {
      /* Vertical standard inline adjustment for ultra-narrow viewport structures */
      .nav-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <img src="feedback.jpeg" alt="Akshat Nahar Profile Banner Element">
    <h1>Feedback Please!</h1>
  </header>

  <nav class="nav-container">
    <a href="index.html" class="btn">Home</a>  
    <a href="index(1).html" class="btn">Photo Gallery</a>
    <a href="index(2).html" class="btn">Video Gallery</a>
    <a href="index(3).html" class="btn">Social Media</a>
    <a href="index(4).html" class="btn">Certificates</a>
    <a href="index(5).html" class="btn">Feedback</a>
  </nav>

  <main>
    <section id="feedback" class="glass-panel">
      <div class="feedback-title">Give me the feedback</div>
      
      <div class="iframe-wrapper">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSc4zwtY-lHjFIIQn1AOQTJgvXnSy1Jj5sMsTh7THsZ_yEPWpg/viewform?embedded=true">Loading…</iframe>
      </div>
      
      <p class="card">Swipe down or refresh the page for a new response.</p>
    </section>
  </main>

  <footer>
    &copy; 2026 Akshat Nahar. Built with Akshat Digital Intelligence.
  </footer>

  <script>
    console.log("Feedback panel asset initialized.");
    const demoEl = document.getElementById("demo");
    if(demoEl) {
      demoEl.innerText = "JS loaded";
    }
  </script>
</body>
</html>
