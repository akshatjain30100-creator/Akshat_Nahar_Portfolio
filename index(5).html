<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akshat Nahar | Portfolio</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }
    
    body { 
      background: url('index(1).jpeg') no-repeat center center fixed; 
      background-size: cover; 
      color: #ffffff; 
      line-height: 1.6; 
    }
    
    header { 
      padding: 60px 20px; 
      text-align: center; 
      background: url('index.jpeg') no-repeat center center; 
      background-size: cover; 
    }

    header img {
      max-width: 100%;
      height: auto;
      border-radius: 50%; /* Optional: Makes the profile image circular and cleaner */
      object-fit: cover;
    }
    
    h1 { 
      font-size: 2.5rem; 
      margin-top: 15px; 
      margin-bottom: 10px; 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }
    
    h2 { 
      font-size: 2.2rem; 
      margin: 40px 0 20px; 
      text-align: center; 
    }
    
    p, .p2-replacement { 
      color: #ffffff; 
      line-height: 1.6; 
      max-width: 700px; 
      margin: 0 auto 40px; 
    }
    
    /* Responsive Navigation Button Container */
    .nav-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      padding: 30px 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .btn { 
      display: inline-block; 
      padding: 12px 24px; 
      background: #04c5fa; 
      color: white; 
      text-decoration: none; 
      border-radius: 8px; 
      font-weight: bold;
      transition: background 0.3s ease;
    }
    
    .btn:hover { 
      background: #03a3d0; 
    }
    
    /* Feedback Section Container */
    section#feedback { 
      padding: 40px 20px; 
      max-width: 800px; 
      margin: 0 auto; 
      text-align: center;
    }

    .feedback-title {
      font-size: 2rem;
      margin-bottom: 20px;
      font-weight: bold;
    }

    /* Makes iframe perfectly responsive across Apple, Android, and Desktop */
    .iframe-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      margin-bottom: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .iframe-wrapper iframe {
      width: 100%;
      height: 80vh; /* Scaled dynamically to look great on all device heights */
      border: 0;
    }
    
    .card { 
      background: rgba(26, 26, 26, 0.85); 
      padding: 20px; 
      border-radius: 12px; 
      border: 1px solid #333; 
      font-size: 1.2rem;
      max-width: 600px;
      margin: 20px auto;
      backdrop-filter: blur(5px); /* Smooth look on iOS/macOS devices */
    }
    
    footer { 
      background: #04f7db; 
      padding: 25px 20px; 
      text-align: center; 
      color: #0b0b0b; 
      font-size: 0.9rem; 
      font-weight: bold;
    }

    /* Media queries for micro-adjustments on mobile views */
    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      .feedback-title { font-size: 1.6rem; }
      .btn { width: 100%; text-align: center; } /* Stack buttons nicely on small phones */
    }
  </style>
</head>
<body>

  <header>
    <img src="feedback.jpeg" width="250" height="250" alt="Akshat Nahar">
    <h1>Feedback Please!</h1>
  </header>

  <nav class="nav-container">
    <a href="index.html" class="btn">Home</a>  
    <a href="index(1).html" class="btn">Photo Gallery</a>
    <a href="index(2).html" class="btn">Video Gallery</a>
    <a href="index(3).html" class="btn">Social Media</a>
    <a href="index(4).html" class="btn">Certificates</a>
    <a href="index(5).html" class="btn">Feedback</a>
  </nav>

  <section id="feedback">
    <div class="feedback-title">Give me the feedback</div>
    
    <div class="iframe-wrapper">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSc4zwtY-lHjFIIQn1AOQTJgvXnSy1Jj5sMsTh7THsZ_yEPWpg/viewform?embedded=true">Loading…</iframe>
    </div>
    
    <p class="card">Swipe down or refresh the page for a new response.</p>
  </section>

  <footer>
    &copy; 2026 Akshat Nahar. Built with Akshat Digital Intelligence.
  </footer>

  <script>
    console.log("Hello from index.js");
    // Added a check to prevent console errors if "demo" element is missing
    const demoEl = document.getElementById("demo");
    if(demoEl) {
      demoEl.innerText = "JS loaded";
    }
  </script>
</body>
</html>
